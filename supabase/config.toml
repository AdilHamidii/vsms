project_id = "virtualsim"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
# MUST match the live value (`alter role authenticator set pgrst.db_max_rows`).
# The catalog is 18,492 routes and PostgREST truncates SILENTLY at this cap —
# HTTP 206, no error, the app just receives fewer routes and every missing one
# renders "Unavailable" or keeps a stale price. Indistinguishable from "the
# prices are wrong" when seen from a phone.
#
# This file said 1000 while production ran 60000, so any `supabase config push`
# would have cut the catalog to 5.4% of itself with no error anywhere.
max_rows = 60000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[realtime]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "relay://auth"
additional_redirect_urls = ["relay://auth"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
# ⚠️ THIS BLOCK DISAGREED WITH PRODUCTION UNTIL 2026-08-18, in both directions:
# it declared `enable_signup = false` while `GET /auth/v1/settings` reported
# `email: true`, and `enable_confirmations = false` while the live project has
# `mailer_autoconfirm: false`, i.e. confirmations REQUIRED. Nothing in the repo
# pushes this file, so **the dashboard is authoritative** — the same drift the
# `max_rows` note at the top of this file records. Read the settings endpoint
# before believing any line here.
enable_signup = true
double_confirm_changes = true
# Load-bearing for money, not just hygiene: `handle_new_user` no longer pays
# the signup grant at INSERT for an unconfirmed address. Turning confirmations
# OFF would hand every self-chosen address a grant with no proof the mailbox is
# even reachable — see 20260818130000_email_signup_normalized_tombstone.sql.
enable_confirmations = true

# ⚠️ SMTP IS NOT CONFIGURED, AND EMAIL AUTH CANNOT SHIP WITHOUT IT. Supabase's
# built-in mailer allows a couple of messages an hour and sends from their
# domain. Set custom SMTP (Resend) in the dashboard — host smtp.resend.com,
# port 465, username `resend`, password = an API key with sending access — and
# edit the "Confirm signup" and "Reset password" templates to contain
# `{{ .Token }}` and NO link: the client verifies a 6-digit code via
# POST /auth/v1/verify and nothing in the app handles the `relay://auth` scheme
# declared above.

[auth.external.apple]
# For native iOS Sign in with Apple we exchange an Apple-signed ID token via
# /auth/v1/token?grant_type=id_token. Supabase verifies the token against
# Apple's public JWKS — no client secret needed.
# The `client_id` here is the iOS bundle ID and matches the `aud` claim
# Supabase expects on incoming tokens.
enabled = true
client_id = "com.anthersystems.VirtualSIM"
skip_nonce_check = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false

# ── Functions that must NOT require a Supabase JWT ─────────────────────────
#
# ⚠️ These entries are the ONLY durable record of the flag. `--no-verify-jwt` on
# the deploy command lives in someone's shell history; this file lives in the
# repo, and a redeploy that forgets the flag 401s every caller SILENTLY — the
# failure telegram-webhook documents, where the bot simply goes deaf.
#
# Three categories, all of which send no Authorization header:
#   • cron relays — pg_net sends only x-cron-secret
#   • provider webhooks — Telnyx signs with Ed25519, Apple with a JWS chain
#   • telegram-webhook — gated by its own secret token plus the owner chat id
#
# Every one of them has its own gate. "No JWT" never means "no auth" here.
[functions.poll-active-orders]
verify_jwt = false
[functions.sync-prices]
verify_jwt = false
[functions.sync-5sim]
verify_jwt = false
[functions.sync-herosms]
verify_jwt = false
[functions.sync-esim-plans]
verify_jwt = false
[functions.sync-smspva-operators]
verify_jwt = false
[functions.sync-smspva-conversions]
verify_jwt = false
[functions.winback]
verify_jwt = false
[functions.daily-credit]
verify_jwt = false
[functions.telegram-notify]
verify_jwt = false
[functions.telegram-webhook]
verify_jwt = false
[functions.telegram-setup]
verify_jwt = false
[functions.goodwill-credit]
verify_jwt = false
[functions.broadcast-push]
verify_jwt = false

# Rented second numbers.
[functions.telnyx-webhook]
verify_jwt = false
[functions.apple-notifications]
verify_jwt = false
[functions.release-lines]
verify_jwt = false
[functions.sync-telnyx-cdr]
verify_jwt = false

[functions.sync-line-voice]
verify_jwt = false
